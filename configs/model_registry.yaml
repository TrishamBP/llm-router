        - url: https://platform.claude.com/docs/en/models/haiku-4-5/overview
          checked_at: 2026-10-10
    capabilities:
      context_window_tokens: 200000
      max_output_tokens: 64000
      supports_tools: null  # not stated on the model page; confirm via Models API
      supports_vision: true  # "Text and images -> text"
      supports_structured_output: null
      parameters:
        temperature: true  # parameter deprecation applies to 4.7 and later only
        top_p: true
        top_k: true
        effort: false  # "Default effort: Not supported"
        thinking_adaptive: false
        thinking_budget_tokens: true  # manual extended thinking
      verified_at: 2026-10-10
      sources:
        - url: https://platform.claude.com/docs/en/models/haiku-4-5/overview
          checked_at: 2026-10-10
        - *src_param_deprecations
    pricing:
