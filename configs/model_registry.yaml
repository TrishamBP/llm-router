# Model registry: the single source of candidate model versions for the router.
#
# Each record is one routable destination: one model version on one provider.
# Schema and procedures: docs/model_registry.md. Validated by llm_router.models.registry.
#
# Rules:
# - `null` means unknown. Unknown prices are never zero; unknown capabilities are never supported.
# - `enabled: true` is a project opt-in, not proof of availability. Candidates must also pass
#   llm_router.routing.candidate_filter for each request.
# - Every non-null price, provider ID, and non-"unverified" lifecycle status needs a source.
# - Benchmark fields are filled only from a reviewed evaluation run (see docs/model_registry.md).
#
# All Anthropic values below were checked against Anthropic's documentation on 2026-10-10.

schema_version: 1

_sources:  # anchors only; ignored by the loader
  overview: &src_overview
    url: https://platform.claude.com/docs/en/models/overview
    checked_at: 2026-10-10
  pricing: &src_pricing
    url: https://platform.claude.com/docs/en/about-claude/pricing
    checked_at: 2026-10-10
    note: "Claude API first-party prices; global routing; excludes batch discount and inference_geo multiplier"
  deprecations: &src_deprecations
    url: https://platform.claude.com/docs/en/about-claude/model-deprecations
    checked_at: 2026-10-10
  parameter_deprecations: &src_param_deprecations
    url: https://platform.claude.com/docs/en/about-claude/model-deprecations#api-parameter-deprecations
    checked_at: 2026-10-10
    note: "temperature/top_p/top_k return 400 when set to non-default values on Claude 4.7 and later"

_parameters:  # anchors only; true = may be set to a non-default value
  claude_4_7_and_later: &params_4_7_plus
    temperature: false
    top_p: false
    top_k: false
    effort: true
    thinking_adaptive: true
    thinking_budget_tokens: false

models:
